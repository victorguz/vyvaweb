# SSR en Amplify Hosting (plataforma WEB_COMPUTE). El adaptador astro-aws-amplify
# deja en .amplify-hosting/ el servidor (compute/default, con todas las
# dependencias dentro del bundle), los archivos estáticos y el deploy-manifest.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - corepack enable
        - corepack prepare pnpm@9.15.9 --activate
        - pnpm -v
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
      - .astro/**/*
